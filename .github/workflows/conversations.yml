name: Conversation controls

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conversations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - name: Install browser
        working-directory: ui
        run: bunx playwright install --with-deps chromium
      - name: Verify deletion, undo, archive search and accessibility
        working-directory: ui
        env:
          TOURI_THREAD_EVIDENCE_DIR: ${{ runner.temp }}/touri-conversations
        run: bunx playwright test test/e2e/thread-deletion.spec.ts --workers=1 --output test-results/conversations
      - name: Keep synthetic conversation screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conversations
          path: ${{ runner.temp }}/touri-conversations/*.png
          if-no-files-found: ignore
          retention-days: 7
