name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialize reruns for a tag so uploads and checksums cannot race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The switches stay false until signing credentials are configured. The guarded
# steps document the release path without making unsigned builds require secrets.
env:
  TOURI_ENABLE_SIGNING: "false"
  TOURI_ENABLE_NOTARIZATION: "false"
  TOURI_ENABLE_UPDATER: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  macos:
    # Match CI's Apple Metal SDK while retaining the app's macOS 14 minimum.
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Remap release source paths
        run: node scripts/release-artifacts.mjs configure
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build:sidecar:macos
      - name: Build unsigned arm64 app
        if: env.TOURI_ENABLE_SIGNING != 'true'
        run: bunx tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Build signed and notarized arm64 app
        if: env.TOURI_ENABLE_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: bunx tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Verify notarization and staple
        if: env.TOURI_ENABLE_NOTARIZATION == 'true'
        run: |
          APP_PATH=$(find src-tauri/target -path '*/bundle/macos/*.app' -maxdepth 8 -print -quit)
          DMG_PATH=$(find src-tauri/target -path '*/bundle/dmg/*.dmg' -maxdepth 8 -print -quit)
          xcrun stapler staple "$DMG_PATH"
          spctl -a -vv "$APP_PATH"
      - name: Generate updater metadata and signature
        if: env.TOURI_ENABLE_UPDATER == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" src-tauri/target/aarch64-apple-darwin/release/bundle/macos/touri.app.tar.gz
      - name: Reject runner home paths in release binaries
        run: node scripts/release-artifacts.mjs check src-tauri/target/aarch64-apple-darwin/release/touri src-tauri/binaries/touri-sidecar-aarch64-apple-darwin
      - name: Upload release artifacts
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: touri-${{ github.ref_name }}-macos-arm64
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.sig
            src-tauri/target/**/bundle/macos/latest.json

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Remap release source paths
        run: node scripts/release-artifacts.mjs configure
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install Linux dependencies (same as CI's native Linux job)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils unzip gnome-keyring dbus
      - run: bun install --frozen-lockfile
      - run: bun run build:sidecar:linux
      - run: bun run tauri build --bundles appimage,deb
      - name: Reject runner home paths in release binaries
        run: node scripts/release-artifacts.mjs check src-tauri/target/release/touri src-tauri/binaries/touri-sidecar-x86_64-unknown-linux-gnu
      - name: Upload release artifacts
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: touri-${{ github.ref_name }}-linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Remap release source paths
        run: node scripts/release-artifacts.mjs configure
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build:sidecar:windows
      - run: bun run tauri build --bundles "msi,nsis"
      - name: Reject runner home paths in release binaries
        run: node scripts/release-artifacts.mjs check src-tauri/target/release/touri.exe src-tauri/binaries/touri-sidecar-x86_64-pc-windows-msvc.exe
      - name: Upload release artifacts
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: touri-${{ github.ref_name }}-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Only consume the immutable artifact IDs produced by this run's build jobs.
      # Do not install dependencies or execute anything from downloaded artifacts.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact-id }}
          path: release-downloads/macos
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.linux.outputs.artifact-id }}
          path: release-downloads/linux
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact-id }}
          path: release-downloads/windows
          merge-multiple: true
      - name: Require all installers, extract version notes and generate SHA256SUMS
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-artifacts.mjs prepare
      - name: Create or update the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --prerelease --latest=false --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --latest=false --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
