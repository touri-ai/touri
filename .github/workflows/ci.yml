name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-profile:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - name: Profile 30 reference-storage repetitions under CPU load
        shell: bash
        run: |
          python3 -c 'while True: sum(range(10000))' &
          load_pid=$!
          trap 'kill "$load_pid"; wait "$load_pid" || true' EXIT
          result=0
          for iteration in $(seq 1 30); do
            echo "REFERENCE_ITERATION=$iteration"
            bun test sidecar/test/kernel/event-reference-async.test.ts || result=1
          done
          exit "$result"
