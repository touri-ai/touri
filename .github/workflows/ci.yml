name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun packages/contracts/src/validate-catalog.ts
      - run: bun test sidecar/test/kernel/catalog-validation.test.ts
      - run: bun test sidecar/test/kernel/schema-contract.test.ts
      - name: Apply the schema with bun:sqlite (FTS5)
        run: bun -e 'import { Database } from "bun:sqlite"; import { readFileSync } from "node:fs"; new Database(":memory:").exec(readFileSync("packages/contracts/schema.sql", "utf8"))'

  sidecar:
    runs-on: macos-14
    env:
      TOURI_VM_INTEGRATION: "0"
      TOURI_E2E_REAL_CLI: "0"
      TOURI_OPENCODE_REAL: "0"
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bun run typecheck
      - run: bun test sidecar/test

  rust:
    runs-on: macos-26
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Test dependency policy
        run: python3 ../scripts/test-rust-policy.py
      - run: cargo deny check

  ui:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.base.json
      - run: bun --cwd ui build

  # The UI suite runs once, here. Pull requests run only the tests that reach a changed file;
  # pushes to main run the whole suite to catch anything the selection missed.
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bash scripts/test-ui-affected.sh ${{ github.event.pull_request.base.sha }}

  composer-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Install browser
        working-directory: ui
        run: bunx playwright install --with-deps chromium
      - name: Check long-conversation typing
        working-directory: ui
        run: bunx playwright test test/e2e/composer-performance.spec.ts --workers=1
      - name: Keep synthetic performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-performance
          path: |
            ui/test-results/**/composer-performance.json
            ui/test-results/**/composer-performance.png
          if-no-files-found: ignore
          retention-days: 7

  license-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx license-checker --production --summary

  linux:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      TOURI_VM_INTEGRATION: "0"
      TOURI_E2E_REAL_CLI: "0"
      TOURI_OPENCODE_REAL: "0"
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils unzip gnome-keyring dbus
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test --timeout 30000 sidecar/test
      - run: bun run build:sidecar:linux
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: dbus-run-session -- bash scripts/test-native-linux.sh
      - run: bun run test:sidecar:smoke
      - run: bunx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: touri-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      TOURI_VM_INTEGRATION: "0"
      TOURI_E2E_REAL_CLI: "0"
      TOURI_OPENCODE_REAL: "0"
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build:sidecar:windows
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: bun run test:sidecar:portable
      - run: bun run test:sidecar:smoke
      - run: bun run tauri build --bundles "msi,nsis"
      - uses: actions/upload-artifact@v4
        with:
          name: touri-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/binaries/touri-sidecar-x86_64-pc-windows-msvc.exe
