name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Only superseded PR runs are canceled; main and manual builds finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - name: Select native coverage
        id: paths
        run: bun .github/ci/changes.ts

  contracts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - run: bun run typecheck --incremental --tsBuildInfoFile node_modules/.cache/ci.tsbuildinfo
      - name: Verify confinement test compatibility with the minimum runtime
        run: bun test sidecar/test/platform/linux-ci-sandbox.test.ts sidecar/test/runtime/linux-folder-sandbox.test.ts
      - run: bun packages/contracts/src/validate-catalog.ts
      - run: bun test sidecar/test/kernel/catalog-validation.test.ts
      - run: bun test sidecar/test/kernel/schema-contract.test.ts
      - name: Apply the schema with bun:sqlite (FTS5)
        run: bun -e 'import { Database } from "bun:sqlite"; import { readFileSync } from "node:fs"; new Database(":memory:").exec(readFileSync("packages/contracts/schema.sql", "utf8"))'

  sidecar-tests:
    name: sidecar shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-15
    env:
      TOURI_VM_INTEGRATION: "0"
      TOURI_E2E_REAL_CLI: "0"
      TOURI_OPENCODE_REAL: "0"
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - if: matrix.shard == 1
        run: bunx biome check .
      - if: matrix.shard == 1
        run: bun run typecheck --incremental --tsBuildInfoFile node_modules/.cache/ci.tsbuildinfo
      - run: bun .github/ci/sidecar-tests.ts ${{ matrix.shard }}

  # Branch protection keeps the original required check name.
  sidecar:
    needs: sidecar-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every sidecar shard
        env:
          RESULT: ${{ needs.sidecar-tests.result }}
        run: test "$RESULT" = success

  rust:
    needs: changes
    runs-on: macos-26
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies, targets and installed tools
        if: needs.changes.outputs.native == 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-bin: true
      - if: needs.changes.outputs.native == 'true'
        run: cargo fmt --check
      - if: needs.changes.outputs.native == 'true'
        run: cargo check
      - if: needs.changes.outputs.native == 'true'
        run: cargo clippy -- -D warnings
      - if: needs.changes.outputs.native == 'true'
        run: cargo test
      - name: Check cached cargo-deny version
        if: needs.changes.outputs.native == 'true'
        id: deny
        run: |
          if [ "$(cargo deny --version 2>/dev/null || true)" = "cargo-deny 0.20.2" ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-deny
        if: needs.changes.outputs.native == 'true' && steps.deny.outputs.installed != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Test dependency policy
        if: needs.changes.outputs.native == 'true'
        run: python3 ../scripts/test-rust-policy.py
      - if: needs.changes.outputs.native == 'true'
        run: cargo deny check
      - name: Report Rust cache
        if: needs.changes.outputs.native == 'true'
        env:
          RUST_HIT: ${{ steps.rust-cache.outputs.cache-hit == 'true' }}
        run: |
          echo "Rust exact hit: $RUST_HIT" | tee -a "$GITHUB_STEP_SUMMARY"

  ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - run: bunx tsc --noEmit -p tsconfig.base.json --incremental --tsBuildInfoFile node_modules/.cache/ci.tsbuildinfo
      - run: bun --cwd ui build

  # The UI suite runs once, here. Pull requests run only the tests that reach a changed file;
  # pushes to main run the whole suite to catch anything the selection missed.
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - run: bash scripts/test-ui-affected.sh ${{ github.event.pull_request.base.sha }}

  browser-e2e:
    runs-on: ubuntu-24.04
    # Match the reference generator's browser, OS libraries and font fallback set.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install archive tool
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - name: Check the complete browser suite
        working-directory: ui
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-durations.json
        run: bunx playwright test --workers=1 --shard=${{ matrix.shard }}/4 --reporter=line,json
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: |
            ui/test-results/browser-durations.json
            ui/test-results/**/*.png
            ui/test-results/**/error-context.md
            ui/test-results/**/project-menu-fonts.json
            docs/qa/visual/*.png
            docs/evidence/qa-r4/*.png
          retention-days: 7

  channel-takeover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - name: Install browser for channel handback
        working-directory: ui
        run: bunx playwright install --with-deps chromium
      - name: Check channel browser handback
        working-directory: ui
        env:
          TOURI_E2E_EVIDENCE_DIR: ${{ runner.temp }}/channel-takeover
        run: bunx playwright test test/e2e/channel-takeover.spec.ts --workers=1 --output test-results/channel-takeover
      - name: Keep synthetic channel handback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: channel-takeover
          path: |
            ${{ runner.temp }}/channel-takeover/*.png
            ui/test-results/channel-takeover/**/trace.zip
            ui/test-results/channel-takeover/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  composer-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - name: Resolve browser cache version
        id: playwright
        working-directory: ui
        shell: bash
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install browser and system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: ui
        run: bunx playwright install --with-deps chromium
      # These verified downloads remain useful even if the performance assertion fails.
      - name: Save verified browser downloads
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - name: Report browser cache
        env:
          BROWSER_HIT: ${{ steps.browsers.outputs.cache-hit == 'true' }}
        run: |
          echo "Playwright exact hit: $BROWSER_HIT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check long-conversation typing
        working-directory: ui
        run: bunx playwright test test/e2e/composer-performance.spec.ts test/e2e/streaming-memory.spec.ts --workers=1
      - name: Check local file citations and previews
        working-directory: ui
        run: bunx playwright test test/e2e/local-file-links.spec.ts --workers=1 --output test-results/local-file-links
      - name: Keep synthetic performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: composer-performance
          path: |
            ui/test-results/**/composer-performance.json
            ui/test-results/**/composer-performance.png
            ui/test-results/**/streaming-memory.json
            ui/test-results/**/after-streaming.png
            ui/test-results/**/after-completed.png
            ui/test-results/local-file-links/**/brace-files-*.png
            ui/test-results/local-file-links/**/generated-image-and-file-links.png
            ui/test-results/local-file-links/**/local-file-preview.png
          if-no-files-found: ignore
          retention-days: 7

  email-signin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - name: Install browser for email sign-in recovery
        working-directory: ui
        run: bunx playwright install --with-deps chromium
      - name: Check email sign-in recovery in both languages and themes
        working-directory: ui
        env:
          TOURI_SIGNIN_EVIDENCE_DIR: ${{ runner.temp }}/touri-email-signin
        run: bunx playwright test test/e2e/email-signin.spec.ts test/e2e/people-invite.spec.ts --workers=1 --output test-results/email-signin
      - name: Keep synthetic email sign-in evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: email-signin
          path: |
            ${{ runner.temp }}/touri-email-signin/*.png
            ui/test-results/email-signin/**/*.png
            ui/test-results/email-signin/**/trace.zip
            ui/test-results/email-signin/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  api-models:
    runs-on: ubuntu-latest
    # Use the same pinned browser and system libraries as the complete browser suite.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install archive tool
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      # Optimization during the flow would reload and reset the in-memory mock service.
      - name: Prepare development dependencies before stateful browser checks
        working-directory: ui
        env:
          VITE_ENABLE_MOCK: "true"
        run: bunx vite optimize --force
      - name: Check responsive design surfaces and approval alignment
        working-directory: ui
        env:
          TOURI_DESIGN_EVIDENCE_DIR: ${{ runner.temp }}/design-polish-evidence/surfaces
          ACTIVITY_ALIGNMENT_EVIDENCE_DIR: ${{ runner.temp }}/design-polish-evidence/activity
          NOTIFICATION_ATTENTION_CAPTURE: ${{ runner.temp }}/design-polish-evidence/attention
        run: >-
          bunx playwright test
          test/e2e/design-surfaces.spec.ts
          test/e2e/activity-alignment.spec.ts
          test/e2e/ui-design-review.spec.ts
          test/e2e/composer-labels-responsive.spec.ts
          test/e2e/notification-attention.spec.ts
          --workers=1
      - name: Keep synthetic responsive design evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-polish
          path: ${{ runner.temp }}/design-polish-evidence/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Check work summary accessible labels
        working-directory: ui
        run: bunx playwright test test/e2e/work-summary-label.spec.ts --workers=1 --output test-results/work-summary-label
      - name: Keep synthetic work summary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-summary-label
          path: ui/test-results/work-summary-label/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Check work queue and concurrency settings on desktop and phone
        working-directory: ui
        env:
          TOURI_SCREENSHOT_DIR: ${{ runner.temp }}/touri-work-evidence
        run: |
          mkdir -p "$TOURI_SCREENSHOT_DIR"
          bunx playwright test test/e2e/work-queue.spec.ts --workers=1
      - name: Keep synthetic work evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-queue
          path: ${{ runner.temp }}/touri-work-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep work navigation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-queue-diagnostics
          path: |
            ui/test-results/**/trace.zip
            ui/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Check chat image layout on desktop and phone in both themes
        working-directory: ui
        env:
          CHAT_IMAGE_CAPTURE: "1"
        run: bunx playwright test test/e2e/chat-image-layout.spec.ts --workers=1
      - name: Keep synthetic chat image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-image-layout
          path: ui/test-results/**/after-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Check API model setup and bot selection
        working-directory: ui
        env:
          TOURI_MODEL_SETTINGS_SHOTS: ${{ runner.temp }}/touri-model-settings-evidence
        run: bunx playwright test test/e2e/api-models.spec.ts test/e2e/model-picker-settings.spec.ts --workers=1
      - name: Keep synthetic model picker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-picker-settings
          path: ${{ runner.temp }}/touri-model-settings-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Check keyboard focus in dialogs and borderless fields
        working-directory: ui
        run: bunx playwright test test/e2e/field-focus.spec.ts --workers=1
      - name: Keep synthetic field focus evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: field-focus
          path: ui/test-results/field-focus-*/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Check settings navigation on phone
        working-directory: ui
        run: bunx playwright test test/e2e/settings-nav-responsive.spec.ts --workers=1
      - name: Check bot panel accessibility on phone
        working-directory: ui
        run: bunx playwright test test/e2e/bot-panel-phone.spec.ts --workers=1
      - name: Check message edit target on phones
        working-directory: ui
        run: bunx playwright test test/e2e/message-edit-target.spec.ts --workers=1 --output test-results/message-edit-target
      - name: Keep message edit target screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: message-edit-target
          path: ui/test-results/message-edit-target/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Check empty bot conversation and paused notice
        working-directory: ui
        run: bunx playwright test test/e2e/select-empty-bot.spec.ts --workers=1 --output test-results/empty-bot
      - name: Keep synthetic empty bot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: empty-bot
          path: ui/test-results/empty-bot/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Check failed-run recovery on desktop and phone
        working-directory: ui
        run: bunx playwright test test/e2e/error-contract.spec.ts test/e2e/recovery-layout.spec.ts test/e2e/model-capacity.spec.ts --workers=1 --output test-results/error-contract
      - name: Keep synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: error-contract
          path: ui/test-results/error-contract/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Check sidebar targets and UI contracts
        working-directory: ui
        env:
          SIDEBAR_CAPTURE: test-results/sidebar-targets
        run: bunx playwright test test/e2e/sidebar-targets.spec.ts test/e2e/ui-contracts.spec.ts --workers=1 --output test-results/sidebar-contracts
      - name: Keep synthetic sidebar evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sidebar-targets
          path: |
            ui/test-results/sidebar-targets/*.png
            ui/test-results/sidebar-contracts/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Check group coordination on desktop and phone
        working-directory: ui
        run: bunx playwright test test/e2e/group-coordination.spec.ts --workers=1
      - name: Check background transcript retention
        working-directory: ui
        run: bunx playwright test test/e2e/workspace-retention.spec.ts --workers=1
      - name: Keep synthetic retention evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-retention
          path: ui/test-results/**/workspace-retention-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Check routine history on desktop and phone
        working-directory: ui
        run: bunx playwright test test/e2e/routine-sidebar.spec.ts --workers=1
      - name: Check automatic conversation mode and task grouping
        working-directory: ui
        env:
          TOURI_SCREENSHOT_DIR: ${{ runner.temp }}/automatic-conversations-evidence
        run: |
          mkdir -p "$TOURI_SCREENSHOT_DIR"
          bunx playwright test test/e2e/automatic-conversations.spec.ts --workers=1
      - name: Keep synthetic automatic conversation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automatic-conversations
          path: ${{ runner.temp }}/automatic-conversations-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Check notification preferences on desktop and phone
        working-directory: ui
        run: bunx playwright test test/e2e/notification-preferences.spec.ts --workers=1 --output test-results/notification-preferences
      - name: Keep synthetic notification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notification-preferences
          path: ui/test-results/**/notification-preferences-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep synthetic group evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: group-coordination
          path: ui/test-results/**/group-partial-success-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Check confirmed group deletion
        working-directory: ui
        run: bunx playwright test test/e2e/group-delete.spec.ts --workers=1
      - name: Keep synthetic group deletion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: group-deletion
          path: ui/test-results/**/group-delete-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Check bot deletion outcomes
        working-directory: ui
        run: bunx playwright test test/e2e/bot-delete-errors.spec.ts --workers=1 --output test-results/bot-deletion
      - name: Keep synthetic bot deletion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bot-deletion
          path: ui/test-results/bot-deletion/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Install pinned API executor
        shell: bash
        run: |
          executor_dir="$RUNNER_TEMP/touri-api-executor"
          mkdir -p "$executor_dir"
          curl -fsSL --retry 3 https://github.com/anomalyco/opencode/releases/download/v1.18.13/opencode-linux-x64.tar.gz -o "$executor_dir/opencode.tar.gz"
          printf '%s  %s\n' '8d500b20fed2d26e537e221895b1a575476571b4f0089bb29fb13eeb8eb9e937' "$executor_dir/opencode.tar.gz" | sha256sum --check
          tar -xzf "$executor_dir/opencode.tar.gz" -C "$executor_dir"
          "$executor_dir/opencode" --version
          echo "TOURI_OPENCODE_BIN=$executor_dir/opencode" >> "$GITHUB_ENV"
      - name: Check API configuration, turns and credential isolation
        run: bun test sidecar/test/api-models sidecar/test/runtime/opencode.test.ts

  license-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - run: bunx license-checker --production --summary

  linux:
    needs: changes
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      TOURI_VM_INTEGRATION: "0"
      TOURI_E2E_REAL_CLI: "0"
      TOURI_OPENCODE_REAL: "0"
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - if: needs.changes.outputs.native == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies, targets and installed tools
        if: needs.changes.outputs.native == 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-bin: true
      - name: Cache downloaded Linux packages
        id: apt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.changes.outputs.native }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install Linux dependencies
        shell: bash
        env:
          NATIVE: ${{ needs.changes.outputs.native }}
        run: |
          # Keep downloaded .debs; apt still resolves and validates current packages on every run.
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          sudo apt-get update
          packages=(bubblewrap)
          if [ "$NATIVE" = true ]; then
            packages+=(libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils unzip gnome-keyring dbus)
          fi
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" -o Binary::apt::APT::Keep-Downloaded-Packages=true install -y "${packages[@]}"
      - run: bun run typecheck --incremental --tsBuildInfoFile node_modules/.cache/ci.tsbuildinfo
      - run: bun run lint
      - name: Verify Linux folder confinement
        run: |
          # Permit test namespaces on this disposable runner; production policy is unchanged.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bun -e '
            import { refreshHostFolderAccess } from "./sidecar/src/kernel/folder-capability.ts"
            if (!(await refreshHostFolderAccess())) throw new Error("Linux folder confinement is unavailable")
          '
      - name: Full Linux sidecar suite
        if: github.event_name != 'pull_request'
        run: bun test --timeout 30000 sidecar/test
      - name: Linux platform and confinement tests
        if: github.event_name == 'pull_request'
        run: bun .github/ci/sidecar-tests.ts linux
      - name: Cache compiled Linux sidecar
        id: sidecar-binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src-tauri/binaries/touri-sidecar-x86_64-unknown-linux-gnu
          key: sidecar-v1-${{ runner.os }}-${{ runner.arch }}-1.4.3-${{ hashFiles('sidecar/src/**', 'packages/contracts/src/**', 'packages/contracts/*.json', 'packages/contracts/*.sql', 'bun.lock', 'package.json', 'sidecar/package.json', 'scripts/build-sidecar.ts', 'scripts/embedded-ui.ts', 'ui/src/**', 'ui/public/**', 'ui/index.html', 'ui/vite.config.ts', 'ui/package.json', 'tsconfig*.json', 'bunfig.toml', 'sidecar/bunfig.toml', '.github/workflows/ci.yml') }}
      - if: steps.sidecar-binary.outputs.cache-hit != 'true'
        run: bun run build:sidecar:linux
      - if: needs.changes.outputs.native == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - if: needs.changes.outputs.native == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - if: needs.changes.outputs.native == 'true'
        run: dbus-run-session -- bash scripts/test-native-linux.sh
      - run: bun run test:sidecar:smoke
      - name: Report Linux caches
        env:
          RUST_HIT: ${{ steps.rust-cache.outputs.cache-hit == 'true' }}
          APT_HIT: ${{ steps.apt.outputs.cache-hit == 'true' }}
          SIDECAR_HIT: ${{ steps.sidecar-binary.outputs.cache-hit == 'true' }}
        run: |
          echo "Rust exact hit: $RUST_HIT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APT exact hit: $APT_HIT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Compiled sidecar exact hit: $SIDECAR_HIT" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: github.event_name != 'pull_request'
        run: bunx tauri build --bundles appimage,deb
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: touri-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  windows:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      TOURI_VM_INTEGRATION: "0"
      TOURI_E2E_REAL_CLI: "0"
      TOURI_OPENCODE_REAL: "0"
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
      - if: needs.changes.outputs.native == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bun run typecheck --incremental --tsBuildInfoFile node_modules/.cache/ci.tsbuildinfo
      - run: bun run lint
      - name: Cache Rust dependencies, targets and installed tools
        if: needs.changes.outputs.native == 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-bin: true
      - name: Cache compiled Windows sidecar
        if: needs.changes.outputs.native == 'true'
        id: sidecar-binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src-tauri/binaries/touri-sidecar-x86_64-pc-windows-msvc.exe
          key: sidecar-v1-${{ runner.os }}-${{ runner.arch }}-1.4.3-${{ hashFiles('sidecar/src/**', 'packages/contracts/src/**', 'packages/contracts/*.json', 'packages/contracts/*.sql', 'bun.lock', 'package.json', 'sidecar/package.json', 'scripts/build-sidecar.ts', 'scripts/embedded-ui.ts', 'ui/src/**', 'ui/public/**', 'ui/index.html', 'ui/vite.config.ts', 'ui/package.json', 'tsconfig*.json', 'bunfig.toml', 'sidecar/bunfig.toml', '.github/workflows/ci.yml') }}
      - if: needs.changes.outputs.native == 'true' && steps.sidecar-binary.outputs.cache-hit != 'true'
        run: bun run build:sidecar:windows
      - if: needs.changes.outputs.native == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - if: needs.changes.outputs.native == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - if: needs.changes.outputs.native == 'true'
        run: bun run test:sidecar:portable
      - if: needs.changes.outputs.native == 'true'
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            bun run test:sidecar:smoke
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Report Windows caches
        if: needs.changes.outputs.native == 'true'
        shell: bash
        env:
          RUST_HIT: ${{ steps.rust-cache.outputs.cache-hit == 'true' }}
          SIDECAR_HIT: ${{ steps.sidecar-binary.outputs.cache-hit == 'true' }}
        run: |
          echo "Rust exact hit: $RUST_HIT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Compiled sidecar exact hit: $SIDECAR_HIT" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: github.event_name != 'pull_request'
        run: bun run tauri build --bundles "msi,nsis"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: touri-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/binaries/touri-sidecar-x86_64-pc-windows-msvc.exe
