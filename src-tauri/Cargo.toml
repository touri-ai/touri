[package]
name = "touri"
version = "0.3.0"
description = "touri desktop"
license = "Apache-2.0"
authors = ["touri contributors"]
edition = "2021"

[lib]
name = "touri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
tauri-plugin-global-shortcut = "2.3"
tauri = { version = "2.8", features = ["unstable", "tray-icon", "webview-data-url", "test"] }
tauri-plugin-autostart = "2.3"
tauri-plugin-dialog = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-updater = "2.3"
getrandom = "0.3"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

[profile.dev]
incremental = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
security-framework = "3.7"
security-framework-sys = "2.17"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSWorkspace", "NSRunningApplication", "block2", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSOperation", "NSNotification", "NSString"] }
screencapturekit = { version = "11", features = ["macos_14_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
portable-pty = "0.9.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
